[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "eye-tracking"
version = "0.1.0"
description = "Real-time eye tracking with a regular webcam using MediaPipe and OpenCV"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Matheus Siqueira", email = "" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "mediapipe>=0.10.14",
]

[project.scripts]
eye-tracking = "eye_tracking.runner:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/eye_tracking", "run.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src/eye_tracking"]
